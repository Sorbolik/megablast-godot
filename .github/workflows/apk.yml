# Costruisce l'APK di prova (release, arm64) a ogni push su main e a mano da
# Actions > APK > Run workflow. L'APK si scarica dagli artefatti della corsa.
# La chiave android/spike.keystore è solo per questa prova (password nota):
# così ogni APK si installa sopra il precedente.
name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GODOT: "4.7"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Godot e modelli di esportazione
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT}.stable"
          unzip -q tpl.tpz && mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT}.stable/"
      - name: Impostazioni dell'editor (SDK Android, Java)
        run: |
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.tres "editor_settings-${GODOT}.tres"; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
              "$ANDROID_SDK_ROOT" "$JAVA_HOME" > "$HOME/.config/godot/$f"
          done
      - name: Esporta l'APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/android/spike.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: spike
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: megablast
        run: |
          godot --headless --import || true
          mkdir -p build
          godot --headless --export-release "Android" build/megablast-godot.apk
          ls -la build
      - uses: actions/upload-artifact@v4
        with:
          name: megablast-godot-${{ github.sha }}
          path: build/megablast-godot.apk
